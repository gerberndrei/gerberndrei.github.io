name: Sync numbered gallery images

on:
  push:
    branches: [main]
    paths:
      - 'images/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-sync-${{ github.ref }}
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out latest repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Update galleries from image folders
        run: node scripts/sync-gallery-images.mjs

      - name: Commit changed image lists and cache version
        run: |
          if git diff --quiet -- content.js index.html; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content.js index.html
          git commit -m "Automatically update galleries after image uploads"
          git push origin "HEAD:${GITHUB_REF_NAME}"
